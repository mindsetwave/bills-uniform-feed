name: Update uniform feed

on:
  schedule:
    - cron: "0 11 * * *"   # daily, 11:00 UTC (morning US Eastern)
    - cron: "0 22 * * *"   # and 22:00 UTC (evening US Eastern)
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrape Gridiron Uniform Database
        run: python3 update_uniforms.py
      - name: Commit changes if any
        run: |
          git config user.name "uniform-feed-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet; then
            git add bills-uniforms-2026.json
            git commit -m "Update uniform feed"
            git push
          else
            echo "No changes."
          fi
